<div class="modal fade" id="stockByWarehouseModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header py-2">
        <div>
          <h5 class="modal-title mb-0"><i class="ti ti-building-warehouse me-1"></i>Stock por almacén</h5>
          <div id="stock-modal-product" class="text-muted small"></div>
        </div>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
      </div>
      <div class="modal-body py-0 small">
        <div id="stock-modal-loading" class="text-center text-muted py-4">Consultando stock…</div>
        <div id="stock-modal-error" class="alert alert-danger m-3 d-none"></div>
        <div id="stock-modal-table" class="table-responsive d-none">
          <table class="table table-sm table-vcenter mb-0">
            <thead class="table-light">
              <tr>
                <th>Sucursal</th>
                <th>Almacén</th>
                <th id="stock-base-heading" class="text-end">Stock</th>
                <th id="stock-equivalent-heading" class="text-end d-none">Equivalente</th>
              </tr>
            </thead>
            <tbody id="stock-modal-rows"></tbody>
          </table>
        </div>
      </div>
      <div class="modal-footer py-2">
        <button type="button" class="btn btn-outline-secondary btn-sm" data-bs-dismiss="modal">Cerrar</button>
      </div>
    </div>
  </div>
</div>
