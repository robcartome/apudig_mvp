<a href="{{ href }}?status={{ status }}&amp;show_all_dates=1" class="list-group-item list-group-item-action d-flex align-items-center gap-3">
  <i class="ti ti-{{ icon }} fs-2 text-secondary" aria-hidden="true"></i>
  <div class="flex-fill"><span class="fw-medium">{{ title }}</span><div class="text-secondary small">{{ subtitle }}</div></div>
  <span class="badge {% if count %}bg-yellow-lt{% else %}bg-secondary-lt{% endif %}">{{ count }}</span>
  <i class="ti ti-chevron-right text-secondary" aria-hidden="true"></i>
</a>
