<div class="col-6 col-lg-3">
  <a href="{{ href }}" class="card card-sm card-link dashboard-shortcut h-100 text-reset">
    <div class="card-body d-flex align-items-center gap-2">
      <span class="avatar avatar-sm bg-{{ color }}-lt flex-shrink-0"><i class="ti ti-{{ icon }} fs-3" aria-hidden="true"></i></span>
      <div class="flex-fill"><span class="fw-semibold small">{{ title }}</span><div class="text-secondary small">{{ subtitle }}</div></div>
      <i class="ti ti-arrow-up-right text-secondary d-none d-sm-block" aria-hidden="true"></i>
    </div>
  </a>
</div>
