<div class="col-sm-6 col-lg-3"><label class="form-label small mb-1">Fechas de creación</label><div class="input-group input-group-sm"><input type="date" name="created_from" value="{{ list_filters.created_from }}" class="form-control"><span class="input-group-text">a</span><input type="date" name="created_to" value="{{ list_filters.created_to }}" class="form-control"></div></div>
<div class="col-sm-3 col-lg-2"><label class="form-label small mb-1">Serie</label><input name="series" value="{{ list_filters.series }}" class="form-control form-control-sm"></div>
<div class="col-sm-3 col-lg-2"><label class="form-label small mb-1">Número</label><input name="number" value="{{ list_filters.number }}" class="form-control form-control-sm"></div>
<div class="col-sm-6 col-lg-2"><label class="form-label small mb-1">Cliente / proveedor</label><input name="party" value="{{ list_filters.party }}" class="form-control form-control-sm"></div>
<div class="col-sm-4 col-lg-2"><label class="form-label small mb-1">Tipo</label><select name="type" class="form-select form-select-sm"><option value="">Todos</option>{% for code,label in type_choices %}<option value="{{ code }}" {% if movement_type == code %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></div>
<div class="col-sm-4 col-lg-2"><label class="form-label small mb-1">Estado</label><select name="status" class="form-select form-select-sm"><option value="">Todos</option>{% for code,label in status_choices %}<option value="{{ code }}" {% if list_filters.status == code %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></div>
<div class="col-sm-4 col-lg-2"><label class="form-label small mb-1">Almacén</label><select name="warehouse" class="form-select form-select-sm"><option value="">Todos</option>{% for item in warehouses %}<option value="{{ item.pk }}" {% if warehouse == item.pk|stringformat:'s' %}selected{% endif %}>{{ item.name }}</option>{% endfor %}</select></div>
